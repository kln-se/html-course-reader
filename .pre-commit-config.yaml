fail_fast: false

default_language_version:
  python: python3.13

exclude: ^_legacy/

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.12
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
        files: ^(?:main\.py$|(?:src/|tests/).*\.pyi?$)
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        files: ^(?:main\.py$|(?:src/|tests/).*\.pyi?$)
        types_or: [python, pyi]
        require_serial: true

  - repo: local
    hooks:
      - id: mypy
        name: mypy (application and tests)
        entry: python -m mypy
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [pre-commit]
      - id: pytest-unit
        name: pytest (unit tests)
        entry: python -m pytest -p no:cacheprovider tests
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [pre-commit]
