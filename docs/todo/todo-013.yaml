title: "Исследование встроенного чтения PDF"
status: "open"
type: "question"
created_at: "2026-09-28"
author: "ai-agent"
description: "Оценить встроенный PDF-просмотрщик Qt WebEngine на текущей версии PySide6: локальные PDF, поиск, масштаб, порядок страниц курса и совместимость с OfflineInterceptor. Проверить необходимую конфигурацию PdfViewerEnabled/PluginsEnabled и portable-поставку. Отдельно согласовать переход от внешнего открытия PDF к встроенному."
context: |
  По решению пользователя встроенный просмотр PDF отложен на период после
  релиза 1.0.0; исследование и реализация не входят в первый релиз. Статус open
  сохранён для будущего рассмотрения только после отдельного решения.
  Источник: https://doc.qt.io/qt-6/qtwebengine-features.html . Не отключать общую
  офлайн-политику ради PDF; QtPdf как альтернативу не добавлять без проверки
  лицензии и отдельного согласования.
