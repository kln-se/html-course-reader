description: "Оформить MIT для собственного кода и минимальный комплект сторонних уведомлений. Проверить условия распространения PySide6, Qt WebEngine, Chromium и остальных поставляемых компонентов, включая доступ к соответствующим исходникам LGPL-библиотек."
context: |
  Пользователь согласовал MIT и минимальный комплект без дополнительных окон.
  Создан LICENSE (2026 kln-se), обновлён README. THIRD_PARTY_NOTICES.txt пока
  содержит предварительные сведения, а не завершённый комплект для поставки.
  Нужно сверить реальные версии и готовые тексты лицензий, обеспечить выбранный
  допустимый способ предоставления исходников LGPL-компонентов и проверить
  возможность замены библиотек. MIT не заменяет лицензии зависимостей.
  Пользователь отдельно разрешил чтение лицензионных файлов и метаданных
  зависимостей в .venv и списка файлов dist/HtmlCourseReader.
  Подтверждены Python 3.13.3, PySide6/Shiboken6/Qt 6.11.1, Chromium
  140.0.7339.225 и PyInstaller 6.22.3. dist пуст, HtmlCourseReader отсутствует.
  Сохранены неизменённые тексты LGPL-3.0, GPL-3.0 и Python LICENSE из
  официальных репозиториев фиксированных версий; LGPL-2.1 — из SPDX v3.27.0
  после ошибки TLS при обращении к GNU. Источники указаны в уведомлениях.
  Установленные пакеты PySide6 содержат только LicenseRef-Qt-Commercial.txt,
  хотя METADATA допускает LGPL/GPL; готового полного комплекта уведомлений
  в них не найдено. После сборки нужны уведомления Chromium и остальных
  реально включённых компонентов, соответствующие исходники и проверка
  заменяемости библиотек. Задача остаётся в работе, публикация не выполнялась.
  Источники: https://opensource.org/license/mit ;
  https://www.qt.io/development/open-source-lgpl-obligations ;
  https://doc.qt.io/qt-6.11/qtwebengine-licensing.html .
