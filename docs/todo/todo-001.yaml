description: "Оформить MIT для собственного кода и сведения о зависимостях для публикации исходников."
context: |
  Ранее рассматривалась поставка portable EXE с комплектом сторонних лицензий.
  Пользователь изменил объём: публикуются только исходники и скрипты сборки;
  EXE и зависимости к релизам не прикладываются. Аудит бинарной поставки
  не входит в этот релиз. При смене способа распространения вопрос открыть заново.
decision: "Сохранены LICENSE (MIT) и краткий THIRD_PARTY_NOTICES.txt. Комплект лицензий для EXE и его копирование исключены из проекта."
