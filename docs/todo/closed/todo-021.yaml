id: "TODO-021"
title: "Добавление выделенного текста страницы в заметки"
status: "done"
type: "improvement"
created_at: "2026-10-04"
author: "ai-agent"
description: |
  Добавить в контекстное меню просмотрщика пункт «Добавить в заметки».
  Он доступен при открытой странице курса и непустом выделенном тексте.
  Нажатие открывает существующий диалог добавления заметки с выделенным
  текстом; пользователь может изменить или дополнить его до подтверждения.
  Сохранить заметку у страницы, с которой взят текст, независимо от выделения
  в дереве файлов и панели заметок. Отмена ничего не сохраняет.
  Сохранять обычный текст без HTML и привязки к элементу страницы.
context: |
  Пользователь предложил сохранять цитаты без ручного копирования после
  успешной ручной проверки сворачивания групп TODO-020 и согласовал поведение.
  Реализация должна использовать существующий механизм заметок и сохранять
  его правила: пустой текст не добавляется, общий счётчик обновляется,
  группа страницы раскрывается, текущий поисковый запрос сохраняется.
  Проверить доступность пункта, передачу текста в редактор, подтверждение,
  отмену и привязку к исходной странице. Затем провести ручную проверку Qt.
  Реализация готова: контекстное меню фиксирует текст и исходную страницу,
  редактор позволяет изменить цитату; смена курса отменяет сохранение.
  Тестовый субагент с python-testing подготовил дополнительные проверки;
  независимый аудит потребовал проверить передачу цитаты в обычный текстовый
  редактор. Существующий тест диалога расширен, замечание закрыто.
  Целевые проверки: 97 passed in 3.08s. Субагент документации подготовил
  уточнения README и docstrings. EXE на этом этапе не запускался.
  Пользователь подтвердил добавление цитат, но сообщил об отсутствии переноса
  длинного предложения в редакторе. Включены WidgetWidth и перенос длинных слов
  для добавления и изменения заметки; сохранённый текст не преобразуется.
  Целевые проверки исправления: 38 passed in 1.52s; аудит без замечаний.
  Пользователь подтвердил повторную визуальную проверку: «вроде все хорошо».
decision: |
  Выделенный текст страницы можно добавить в заметки через меню ПКМ,
  отредактировать перед сохранением или отменить. Перенос по ширине редактора
  работает при добавлении и изменении без преобразования сохраняемого текста.
  Целевые тесты и аудит выполнены, ручная проверка подтверждена пользователем.
resolved_at: "2026-10-04"
resolved_by: "user"
