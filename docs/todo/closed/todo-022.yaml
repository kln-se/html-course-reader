description: |
  Показывать в списке выбора курса название корневой папки основным
  полужирным текстом, а ниже — полный путь меньшим моноширинным шрифтом
  приглушённого цвета текущей темы. Сокращать длинный путь многоточием,
  показывать полный путь в подсказке. Сохранить единое выделение строки,
  двойной клик, фокус активного курса, перенос и удаление выбранного курса.
context: |
  Пользователь сообщил, что один полный путь вместо названия малоинформативен,
  и согласовал двухстрочный вариант. Ключ курса остаётся полным путём;
  изменение относится к отображению и не требует миграции истории.
  Реализация и документация готовы. Пройдено 79 целевых тестов списка курсов,
  удаления, активного курса и делегатов дерева. Независимый аудит тестов
  завершён без блокирующих замечаний после добавления переключения между
  одноимёнными курсами. Пользователь подтвердил ручную проверку.
  EXE после изменения не пересобирался.
decision: |
  Двухстрочное отображение реализовано; пользователь подтвердил результат.
  Пройдено 79 целевых тестов, аудит без блокирующих замечаний.
