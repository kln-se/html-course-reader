id: "TODO-007"
title: "Разрешение удалённых ресурсов страниц"
status: "done"
type: "task"
created_at: "2026-09-28"
author: "ai-agent"
description: |
  Разрешать выбранные удалённые изображения, стили и шрифты независимо от открытия
  интернет-ссылок во внешнем браузере. По умолчанию загрузка выключена.
  Реализация, целевые автотесты и ручная проверка пользователем завершены.
context: |
  Реализованы режимы «Не загружать» / «Загружать выбранные типы», сохраняемые
  флажки изображений, стилей и шрифтов, динамическое пояснение и SVG-предупреждение.
  Секция remote_resources проверяет четыре логических значения; отсутствующие
  параметры получают значения по умолчанию без записи при запуске.
  «Применить» и запуск согласуют OfflineInterceptor с настройкой WebEngine:
  разрешены только HTTP/HTTPS GET выбранных ResourceType. Скрипты, XHR, медиа
  и документы из сети блокируются; локальные схемы и internet_links независимы.
  Новая политика действует на последующие запросы, не удаляет загруженные ресурсы
  и не отзывает начатые запросы. Ранее заблокированные ресурсы требуют повторного
  открытия страницы; ограничения Chromium/CORS сохраняются.
  Финальный целевой запуск: 996 passed in 6.52s; независимый аудит — GO без
  блокирующих замечаний. Подмены Qt не проверяют реальный GUI, сеть, перенаправления
  и кеш. Пользователь подтвердил работу загрузки ресурсов и исправление изменения
  шрифта при применении настроек. Проверка настоящего окна: 1 passed in 7.59s.
  Полный набор тестов и EXE на этом этапе не проверялись.
decision: |
  Выполнение подтверждено пользователем. Доступны независимое разрешение удалённых
  ресурсов и выбор изображений, стилей и шрифтов. Базовый шрифт задаётся до создания
  главного окна и сохраняется при применении настроек и переключении темы.
resolved_at: "2026-10-03"
resolved_by: "user"
