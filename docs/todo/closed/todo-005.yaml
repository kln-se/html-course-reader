id: "TODO-005"
title: "Поиск по дереву файлов"
status: "done"
type: "task"
created_at: "2026-09-28"
author: "ai-agent"
description: |
  Добавить SVG-кнопку «Найти файл» после кнопки показа текущей страницы.
  Кнопка открывает строку под управлением деревом и передаёт ей фокус.
  Поиск фильтрует дерево по подстроке относительного пути, включая имя файла,
  без учёта регистра; пробелы по краям игнорируются, разделители / и \ равнозначны.
  Родители совпадений видимы и раскрыты; пустой результат обозначен сообщением.
  Очистка возвращает дерево и прежнее раскрытие папок, затем показывает
  и выделяет текущую страницу, если она присутствует, без повторной загрузки.
  Escape закрывает поиск с очисткой запроса и возвратом фокуса дереву.
  Смена курса сбрасывает и закрывает поиск; обновление каталога сохраняет запрос.
  Кнопка показа текущей страницы очищает запрос перед выделением файла.
context: |
  Реализация и целевые тесты добавлены; 140 тестов прошли за 2.47 с,
  независимый аудит дал GO. Проверки используют подмены компонентов Qt.
  Пользователь подтвердил ручную проверку поиска и исправление положения крестика.
  Поиск по содержимому не входит в задачу. Фильтр групп форматов действует;
  навигация вперёд/назад использует полный список файлов этого фильтра,
  независимо от поискового запроса. При фокусе в дереве или строке поиска
  Escape закрывает поиск файлов; при фокусе в заметках приоритет у заметок.
  Иначе приоритет: поиск по странице, заметки, поиск файлов.
  Активные диалоги и всплывающие меню обрабатывают Escape самостоятельно.
  Полный набор тестов и EXE после изменения не проверены.

decision: "Поиск реализован; 140 целевых тестов прошли, независимый аудит без блокирующих замечаний. Пользователь подтвердил работу поиска и исправление выравнивания кнопки очистки."
resolved_at: "2026-10-01"
