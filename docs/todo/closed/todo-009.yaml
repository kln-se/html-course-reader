id: "TODO-009"
title: "Метки форматов со скруглённым фоном"
status: "done"
type: "improvement"
created_at: "2026-09-28"
author: "ai-agent"
description: "Заменить визуальные текстовые префиксы [.html] на компактные скруглённые метки с текстом формата, например HTML. Рисовать фон и текст делегатом Qt, а не отдельным SVG для каждого расширения. Сохранить пути, доступное имя, выделение, сокращение длинного имени и читаемость двух тем/DPI."
context: |
  Реализованы метки HTML, MP4, PDF без точки и скобок, с единым оформлением
  для всех форматов и поддержкой обеих тем, выделения и узких строк.
  Папки остаются Bold, имена файлов Regular. TODO008 отложен за пределы 1.0.0.
  Пользователь заметил сокращение PDF до P… и согласовал полный текст меток.
  Убраны ограничение ширины, сокращение и скрытие метки. Имя получает остаток
  ширины; физическая граница видимой области по-прежнему ограничивает рисование.
  Финальные целевые тесты: 58 passed in 10.97s; замечание аудитора о границах
  рисования закреплено проверкой clipping перед отрисовкой метки.
  Реальное рисование, DPI и EXE автотестами не проверялись. Пользователь
  подтвердил повторную ручную проверку исправления: «всё хорошо».
decision: |
  Выполнение подтверждено пользователем. Метки форматов рисуются со скруглённым
  фоном без программного сокращения и скрытия. Сокращается только имя файла;
  рисование ограничено видимой областью дерева.
resolved_at: "2026-10-03"
resolved_by: "user"
