id: "TODO-020"
title: "Компактное управление и сворачиваемые группы заметок"
status: "done"
type: "improvement"
created_at: "2026-10-03"
author: "ai-agent"
description: |
  Переработать панель «Заметки курса»:
  - Заменить четыре большие текстовые кнопки «Добавить к открытой странице»,
    «Открыть страницу», «Изменить», «Удалить» компактными кнопками-иконками
    по образцу панели дерева файлов. Разместить их под заголовком панели;
    каждой задать русскую подсказку при наведении и доступное имя.
  - В строке «Открытая страница: <название страницы>» визуально отделить
    подпись от названия, например полужирным начертанием подписи.
  - Разрешить сворачивать и разворачивать группу заметок каждой страницы,
    чтобы большая группа не мешала переходу к заметкам других страниц.
  - Устранить лишнюю горизонтальную прокрутку при длинных путях и названиях.
    Сохранить перенос текста и доступность полного пути; проверить узкую панель,
    обе темы и масштабирование. Если горизонтальная прокрутка где-либо нужна,
    согласовать её оформление с вертикальной.
context: |
  Пользователь сообщил, что текущие четыре кнопки занимают много места,
  группа из 20 заметок заставляет долго прокручивать список, а горизонтальная
  полоса со стандартным оформлением сдвигает уже перенесённый текст лишь немного.
  Причину лишней прокрутки нужно установить при реализации; предположение
  о включённой по умолчанию прокрутке пока не проверено.
  Сохранить существующий контракт: новая заметка относится к открытой странице,
  остальные действия — к выбранной заметке. Сохранить поиск по всему курсу,
  общий счётчик, подтверждение удаления, закрытие по Escape и состояния
  доступности действий. Не менять содержимое страниц курса.
  Это отдельная задача после текущей работы над метками форматов TODO-009.
  Работа разбита на два этапа: сначала компактное управление, подпись страницы
  и горизонтальная прокрутка; затем сворачивание групп. Первый этап реализован:
  иконки над поиском, полужирная подпись открытой страницы, экранированный путь,
  ScrollBarAlwaysOff и ResizeMode.Adjust для списка с сохранённым переносом.
  Целевые тесты: 76 passed in 14.27s. После аудита проверены независимые состояния
  открытой страницы и выбранной заметки. Пользователь подтвердил первый этап
  ручной проверкой и после исправления фокуса сообщил «теперь всё хорошо».
  После ручной проверки по просьбе пользователя убран явный setFocus на кнопке
  добавления при открытии панели; доступность кнопок через Tab сохранена.
  Целевые проверки фокуса и Esc: 66 passed in 4.66s.
  Второй этап реализован: клик по заголовку скрывает или показывает заметки
  страницы, состояние сохраняется при переходах внутри курса и сбрасывается
  при смене курса. Поиск временно раскрывает результаты, очистка возвращает
  запомненное состояние; скрытый выбор сбрасывается. Добавление раскрывает
  группу открытой страницы, сохраняя запрос. Хранение заметок не изменилось.
  Целевые проверки второго этапа: 126 passed in 2.84s. Тестовый субагент
  подготовил сценарии; независимый аудит потребовал проверки шевронов и сброса
  скрытого выбора после очистки поиска; оба замечания устранены и перепроверены.
  Субагент документации подготовил уточнения README и docstrings.
  Пользователь подтвердил ручную проверку второго этапа сообщением «Все хорошо».
  Полный набор тестов и EXE на этом этапе не запускались.
decision: |
  Реализованы компактные кнопки, выделенная подпись страницы, сворачиваемые
  группы и отключение лишней горизонтальной прокрутки. Целевые тесты и аудит
  выполнены; пользователь подтвердил ручную проверку интерфейса.
resolved_at: "2026-10-04"
resolved_by: "user"
