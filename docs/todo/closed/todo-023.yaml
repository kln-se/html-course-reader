description: |
  В заголовках групп заметок показывать имя файла полужирным, ниже —
  относительный путь меньшим моноширинным шрифтом приглушённого цвета.
  Сохранить шеврон сворачивания и вывести количество заметок меткой справа.
  Блок открытой страницы отделить тонкой линией; показать подпись, имя
  и относительный путь с той же иерархией. Длинные строки сокращать,
  полный путь показывать в подсказке. Дату изменения заметки сделать
  приглушённой и немного меньше основного текста.
context: |
  Пользователь согласовал оформление по аналогии со списком курсов
  (TODO-022) и отдельно предложил приглушить дату изменения заметки.
  Название страницы означает имя файла, а не заголовок HTML.
  Сворачивание, поиск, выбор и привязка заметок к странице сохраняются.
  Реализация и документация готовы, пройдено 93 целевых теста.
  Ручная проверка выявила исчезновение шеврона: ссылка на QIcon обнулялась
  при очистке стандартной иконки делегата. Добавлена явная копия QIcon
  и регрессионная проверка с настоящим свойством QStyleOptionViewItem.icon.
  Пользователь подтвердил повторную ручную проверку. EXE не пересобирался.
decision: |
  Оформление страниц и дат в заметках обновлено, шеврон восстановлен.
  Пройдено 93 целевых теста; аудит исправления без блокирующих замечаний.
  Пользователь подтвердил результат словами «теперь всё хорошо».
