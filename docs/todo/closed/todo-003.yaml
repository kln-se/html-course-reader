description: "Добавить закрытие поиска по странице и панели заметок клавишей Esc. Определить приоритет при одновременно открытых панелях: сначала панель с фокусом; активный диалог обрабатывает Escape сам. Закрытие поиска снимает подсветку и возвращает удобный фокус."
context: |
  Этап 3 реализован в src/course_reader/window.py: Escape без модификаторов
  закрывает заметки при фокусе внутри них; иначе сначала поиск, затем заметки.
  Закрытие возвращает фокус странице, поиск также снимает подсветку.
  Модальные диалоги и всплывающие меню обрабатывают Escape самостоятельно;
  автоповтор не закрывает несколько панелей. В редакторе заметок русские
  кнопки «Добавить»/«Сохранить» и «Отмена».
  Прошли 113 целевых тестов; независимый аудит дал GO. Тесты используют
  подмены компонентов интерфейса. Пользователь подтвердил ручную проверку Qt.
  Полный набор и EXE после изменения не проверены.
  Последующее применение той же логики к поиску дерева и заметок;
  отложенные горячие клавиши навигации не добавлены.
decision: "Реализовано закрытие панелей по Esc и русские кнопки редактора заметок. Прошли 113 целевых тестов; независимый аудит не выявил блокирующих замечаний. Пользователь подтвердил работу интерфейса при ручной проверке."
