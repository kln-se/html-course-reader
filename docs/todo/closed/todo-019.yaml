description: "В диалоге выбора курса добавить кнопку «Удалить из списка», доступную при выбранном курсе. После подтверждения удалить связь с курсом, историю чтения, избранное и заметки. Папку курса и её файлы на диске не изменять. В подтверждении показать название курса и последствия; кнопки «Удалить» и «Отмена», по умолчанию «Отмена», Escape и закрытие диалога отменяют действие. При удалении текущего курса очистить область чтения, дерево и заметки, сбросить активный курс. Повторное добавление той же папки создаёт новый курс без прежнего состояния."
context: "Реализовано после TODO-006. Пройдено 150 целевых тестов, включая 14 новых; независимый аудит — GO без блокирующих замечаний. Проверены сохранность файлов и других курсов, отмена, ошибка записи с восстановлением состояния, очистка текущего курса, защита от старых callbacks и повторное добавление. Пользователь подтвердил ручную проверку удаления курса и исправления значков панели заметок. Проверять через main.py на временном курсе: отмена, удаление текущего и другого курса, перезапуск, сохранность папки, повторное добавление. Полный набор и EXE не проверены."

