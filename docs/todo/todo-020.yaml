description: |
  Переработать панель «Заметки курса»:
  - Заменить четыре большие текстовые кнопки «Добавить к открытой странице»,
    «Открыть страницу», «Изменить», «Удалить» компактными кнопками-иконками
    по образцу панели дерева файлов. Разместить их под заголовком панели;
    каждой задать русскую подсказку при наведении и доступное имя.
  - В строке «Открытая страница: <название страницы>» визуально отделить
    подпись от названия, например полужирным начертанием подписи.
  - Разрешить сворачивать и разворачивать группу заметок каждой страницы,
    чтобы большая группа не мешала переходу к заметкам других страниц.
  - Устранить лишнюю горизонтальную прокрутку при длинных путях и названиях.
    Сохранить перенос текста и доступность полного пути; проверить узкую панель,
    обе темы и масштабирование. Если горизонтальная прокрутка где-либо нужна,
    согласовать её оформление с вертикальной.
context: |
  Пользователь сообщил, что текущие четыре кнопки занимают много места,
  группа из 20 заметок заставляет долго прокручивать список, а горизонтальная
  полоса со стандартным оформлением сдвигает уже перенесённый текст лишь немного.
  Причину лишней прокрутки нужно установить при реализации; предположение
  о включённой по умолчанию прокрутке пока не проверено.
  Сохранить существующий контракт: новая заметка относится к открытой странице,
  остальные действия — к выбранной заметке. Сохранить поиск по всему курсу,
  общий счётчик, подтверждение удаления, закрытие по Escape и состояния
  доступности действий. Не менять содержимое страниц курса.
  Это отдельная задача после текущей работы над метками форматов TODO-009.
